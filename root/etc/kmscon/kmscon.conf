font-name=AdwaitaMono Nerd Font Mono
# TODO: guard this with {{ .isPersonal }}.
# Seems hard to implement using the current solution for root-owned files.
xkb-layout=us,bg
xkb-variant=,phonetic
# Toggle the layout with `Alt+Shift`.
# Use `Caps Lock` as `Escape` and `Shift+Caps Lock` as normal `Caps Lock`. 
# Use `Scroll Lock` LED as alternative layout indicator.
xkb-options=grp:alt_shift_toggle,caps:escape_shifted_capslock,grp_led:scroll

