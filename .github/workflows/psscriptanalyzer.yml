name: PSScriptAnalayzer

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  psscriptanalyzer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Invoke-ScriptAnalyzer `
            -EnableExit `
            -ExcludeRule PSAvoidUsingInvokeExpression `
            -Path ./ `
            -Recurse
