name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          #  gitleaks-action uses this to call a GitHub API to comment on PRs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
