[project]
name = "dotfiles"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Iliya Iliev", email = "iliq0000@proton.me" }]
dependencies = [
  "gnome-extensions-cli>=0.11.0; sys_platform == 'linux'",
  "requests>=2.34.2",
  "rich>=15.0.0",
  "vdf>=3.4",
  "winrt-Windows.ApplicationModel>=3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3.2.1; sys_platform == 'win32'",
  "winrt-Windows.Management.Deployment>=3.2.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
  "kodistubs>=21.0.0",
]

[build-system]
requires = ["uv_build<0.13"]
build-backend = "uv_build"

[tool.ruff]
extension = { "py.tmpl" = "python" }
lint.extend-select = [
  "TC",  # Type checking.
]
lint.ignore = [
  "EXE001",  # Allow shebangs in non-executable files.
]
src = [
  ".",
  "home/private_dot_local/share/kodi/addons/service.chezmoi.bootstrap",
]

[tool.tombi]
files.include = [
  "**/*.toml",
  "**/mise/miserc.toml.tmpl",
  "**/uv/uv.toml.tmpl",
]

[[tool.tombi.schemas]]
path = "https://raw.githubusercontent.com/jdx/mise/refs/heads/main/schema/miserc.json"
include = ["**/mise/miserc.toml.tmpl"]

[[tool.tombi.schemas]]
path = "https://www.schemastore.org/uv.json"
include = ["**/uv/uv.toml.tmpl"]

[tool.ty]
environment.python-platform = "all"
environment.root = [
  ".",
  "home/private_dot_local/share/kodi/addons/service.chezmoi.bootstrap",
]

[tool.uv]
build-backend.module-root = ""
build-backend.module-name = ["helpers"]
environments = [
  "sys_platform == 'android' and implementation_name == 'cpython'",
  "sys_platform == 'linux' and implementation_name == 'cpython'",
  "sys_platform == 'win32' and implementation_name == 'cpython'",
]
