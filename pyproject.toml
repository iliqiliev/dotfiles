[project]
name = "dotfiles"
version = "1.0.0"
requires-python = ">=3.14"

[dependency-groups]
dev = [
  "kodistubs",
  "pygobject-stubs",
  "requests",
  "rich",
  "vdf",
  "winrt-Windows.ApplicationModel; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
  "winrt-Windows.Management.Deployment; sys_platform == 'win32'",
]

[build-system]
requires = ["uv_build<0.13"]
build-backend = "uv_build"

[tool.ruff]
extension = { "py.tmpl" = "python" }
lint.extend-select = [
  "TC",  # Type checking.
]
lint.ignore = [
  "EXE001",  # Allow shebangs in non-executable files.
  "PLW1510",  # Allow `subprocess.run` without explicit `check` argument.
]
src = [
  ".",
  "home/private_dot_local/share/kodi/addons/service.chezmoi.bootstrap",
]

[tool.tombi]
files.include = [
  "**/*.toml",
  "**/mise/config.toml.tmpl",
  "**/uv.toml.tmpl",
]

[[tool.tombi.schemas]]
path = "https://mise.jdx.dev/schema/mise.json"
include = ["**/mise/config.toml.tmpl"]

[[tool.tombi.schemas]]
path = "https://www.schemastore.org/uv.json"
include = ["**/uv.toml.tmpl"]

[tool.ty]
environment.python-platform = "all"
environment.root = [
  ".",
  "home/private_dot_local/share/kodi/addons/service.chezmoi.bootstrap",
]

[tool.uv]
build-backend.module-root = ""
build-backend.module-name = ["helpers"]
exclude-dependencies = ["pygobject"]
environments = [
  "sys_platform == 'android' and implementation_name == 'cpython'",
  "sys_platform == 'linux' and implementation_name == 'cpython'",
  "sys_platform == 'win32' and implementation_name == 'cpython'",
]
