[bootstrap.packages]
# `tree-sitter` needs a C compiler.
"apk:gcc" = "latest"
"apt:gcc" = "latest"
"dnf:gcc" = "latest"
"pacman:gcc" = "latest"

[env]
HOME = { default = "$USERPROFILE" }
# XDG User Directories:
XDG_CACHE_HOME = "$HOME/.cache"
XDG_CONFIG_HOME = "$HOME/.config"
XDG_DATA_HOME = "$HOME/.local/share"
XDG_STATE_HOME = "$HOME/.local/state"

[tool_alias]
bashls = "npm:bash-language-server"
fish-lsp = "npm:fish-lsp"
tclint = "pipx:tclint"

[tools]
node = "latest"
lua-language-server = "latest"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
tombi = "latest"
topgrade = "latest"
tree-sitter = "latest"
ty = "latest"
usage = "latest"

[tools.bashls]
depends = "node"
version = "latest"

[tools.fish-lsp]
depends = "node"
os = ["linux"]
version = "latest"

[tools.tclint]
uvx_args = "--quiet"
version = "latest"

[settings]
minimum_release_age_excludes = ["ruff", "ty", "uv"]
node.compile = false
