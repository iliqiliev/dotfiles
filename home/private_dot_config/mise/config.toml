[tool_alias]
# Used Aliases:
basedpyright = "npm:basedpyright"
bashls = "npm:bash-language-server"
brush = "cargo:brush-shell"
fish-lsp = "npm:fish-lsp"
powershell-es = "github:PowerShell/PowerShellEditorServices"
tclint = "pipx:tclint"
# Unused Aliases:
fish = "aqua:fish-shell/fish-shell"

[tools]
# Core Tools:
cargo-binstall = "latest"
lua-language-server = "latest"
node = "latest"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
tombi = "latest"
topgrade = "latest"
tree-sitter = "latest"
uv = "latest"
# Aliased Tools:
basedpyright = "latest"
bashls = "latest"
brush = { version = "latest", os = "windows" }
fish-lsp = "latest"
powershell-es = "latest"
tclint = "latest"

[settings.node]
compile = false

[settings.python]
compile = false

[settings.cargo]
binstall_only = true
binstall_quickinstall = true
