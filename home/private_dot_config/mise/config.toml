[bootstrap.packages]
"apt:libatomic1" = "latest"  # Required by `node`.
"apk:build-base" = "latest"  # `tree-sitter` needs `cc`.
"apt:gcc" = "latest"  # `tree-sitter` needs `cc`.
"pacman:gcc" = "latest"  # `tree-sitter` needs `cc`.

[env]
# $HOME is not set on Windows.
HOME = { default = "$USERPROFILE" }
# XDG User Directories:
XDG_CACHE_HOME = "$HOME/.cache"
XDG_CONFIG_HOME = "$HOME/.config"
XDG_DATA_HOME = "$HOME/.local/share"
XDG_STATE_HOME = "$HOME/.local/state"
# Environment Variables:
NPM_CONFIG_USERCONFIG = "$XDG_CONFIG_HOME/npm/npmrc"  # For `node`.

[tool_alias]
# Used Aliases:
bashls = "npm:bash-language-server"
brush = "cargo:brush-shell"
fish-lsp = "github:ndonfris/fish-lsp"
tclint = "pipx:tclint"
# Unused Aliases:
fish = "aqua:fish-shell/fish-shell"

[tools]
cargo-binstall = "latest"
lua-language-server = "latest"
node = "latest"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
tombi = "latest"
topgrade = "latest"
tree-sitter = "latest"
ty = "latest"
usage = "latest"

[tools.bashls]
version = "latest"
depends = "node"

[tools.brush]
depends = "cargo-binstall"
version = "latest"
os = ["windows"]

[tools.fish-lsp]
asset_pattern = "fish-lsp.standalone"
bin = "fish-lsp"
os = ["linux"]
version = "latest"

[tools.tclint]
uvx_args = "--quiet"
version = "latest"

[settings]
cargo.binstall_only = true
cargo.binstall_quickinstall = true
node.compile = false
