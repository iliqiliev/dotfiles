[bootstrap.packages]
"apt:libatomic1" = "latest"  # Required by `node`.

[env]
# $HOME is not set on Windows.
HOME = { default = "$USERPROFILE" }
# XDG User Directories:
XDG_CACHE_HOME = "$HOME/.cache"
XDG_CONFIG_HOME = "$HOME/.config"
XDG_DATA_HOME = "$HOME/.local/share"
XDG_STATE_HOME = "$HOME/.local/state"
# Environment Variables:
NPM_CONFIG_USERCONFIG = "$XDG_CONFIG_HOME/npm/npmrc"  # For `node`.

[tool_alias]
# Used Aliases:
bashls = "npm:bash-language-server"
brush = "cargo:brush-shell"
fish-lsp = "github:ndonfris/fish-lsp"
tclint = "pipx:tclint"
# Unused Aliases:
fish = "aqua:fish-shell/fish-shell"

[tools]
# Core Tools:
cargo-binstall = "latest"
lua-language-server = "latest"
node = "latest"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
tombi = "latest"
topgrade = "latest"
tree-sitter = "latest"
ty = "latest"
usage = "latest"
# Aliased Tools:
bashls = { version = "latest", depends = "node" }
brush = { version = "latest", os = ["windows"], depends = "cargo-binstall" }
fish-lsp = { version = "latest", os = ["linux"], asset_pattern = "fish-lsp.standalone", bin = "fish-lsp" }
tclint = { version = "latest", uvx_args = "--quiet" }

[settings.node]
compile = false

[settings.python]
compile = false

[settings.cargo]
binstall_only = true
binstall_quickinstall = true
