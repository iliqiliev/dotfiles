[bootstrap.packages]
# Needed for `node`.
bash = "latest"
# Fixes tools like `chezmoi`, `fastfetch`, `lua-language-server`.
gcompat = "latest"
# Contains `chsh`, needed by `mise` to change the default shell.
shadow = "latest"
# mise's version cannot find `/lib64/ld-linux-x86-64.so.2`.
tree-sitter-cli = "latest"

[settings]
disable_tools = ["tree-sitter"]
