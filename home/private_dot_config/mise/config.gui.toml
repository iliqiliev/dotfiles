[tool_alias]
kitty = "github:kovidgoyal/kitty"

[tools.kitty]
version = "latest"
os = "linux"
postinstall = """

# Install the desktop entry so `kitty` shows in application list.
mkdir -p ~/.local/share/applications
cp "$MISE_TOOL_INSTALL_PATH"/share/applications/kitty*.desktop ~/.local/share/applications 

# Install `kitty` icons for the fallback theme.
mkdir -p ~/.local/share/icons
cp -r "$MISE_TOOL_INSTALL_PATH"/share/icons/hicolor ~/.local/share/icons

"""

[tools.kitty.platforms]
linux-x64 = { asset_pattern = "kitty-{{ version }}-x86_64.txz" }
linux-arm64 = { asset_pattern = "kitty-{{ version }}-arm64.txz" }
