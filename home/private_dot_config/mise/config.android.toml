[bootstrap.packages]
# This overrides the entry from the main config and
# and is needed as `gcc` is not available on Termux.
gcc = { names = { apt = "clang" } }
# The `mise` version cannot find `/lib/ld-musl-aarch64.so.1`.
nodejs = "latest"
# The `mise` version cannot find `/lib/ld-musl-aarch64.so.1`.
tree-sitter = "latest"

[env]
# This fixes `uv` trying to install broken Python versions.
UV_PYTHON_PREFERENCE = "only-system"

[settings]
disable_tools = ["node", "tree-sitter"]

[settings.system_packages]
# `mise` tries to use `sudo` otherwise.
elevate_with = ""

[tools]
uv = { version = "latest", postinstall = "pkg install --yes -- python" }
