[ca/desrt/dconf-editor]
show-warning=false

[org/gnome/desktop/input-sources]
per-window=true
{{ if .isPersonal -}}
sources=[('xkb', 'us'), ('xkb', 'bg+phonetic')]
{{ end -}}

[org/gnome/desktop/interface]
gtk-enable-primary-paste=false
gtk-theme='adw-gtk3'
icon-theme='Morewaita'

[org/gnome/desktop/peripherals/keyboard]
numlock-state=true

[org/gnome/desktop/peripherals/mouse]
accel-profile='flat'

[org/gnome/desktop/wm/keybindings]
panel-run-dialog=['<Super>r']
show-desktop=['<Super>d']
switch-input-source=['<Alt>Shift_L']
switch-input-source-backward=['<Shift>Alt_L']
switch-to-workspace-left=['<Control><Super>Left']
switch-to-workspace-right=['<Control><Super>Right']

[org/gnome/desktop/wm/preferences]
action-middle-click-titlebar='minimize'
mouse-button-modifier='<Super>'
resize-with-right-button=true

[org/gnome/mutter]
attach-modal-dialogs=false

[org/gnome/settings-daemon/plugins/media-keys]
calculator=['Calculator']
control-center=['<Control><Super>comma']
help=['']
home=['<Super>e']
logout=['<Shift><Super>l']
mic-mute=['Scroll_Lock']
reboot=['<Control><Alt>Delete']
shutdown=['<Shift><Control><Alt>Delete']
volume-step=5

[org/gnome/settings-daemon/plugins/media-keys]
{{ $customKeybindings := list -}}
{{ range until 3 -}}
{{   $path := print "/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom" . "/" -}}
{{   $customKeybindings = append $customKeybindings $path -}}
{{ end -}}
custom-keybindings=[{{ quoteList $customKeybindings | join ", " }}]

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Shift><Control>Escape'
command='missioncenter'
name='Task Manager'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding='<Super>C'
command='com.github.dynobo.normcap'
name='Optical Character Recognition'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2]
binding='<Super>X'
command='gdbus call --session --dest org.gnome.Shell --object-path /org/gnome/Shell/Extensions/ForceQuit --method org.gnome.Shell.Extensions.ForceQuit.SelectWindow'
name='Force Quit Window Selector'

[org/gnome/shell]
always-show-log-out=true
disable-extension-version-validation=true
{{ if .isPersonal -}}
favorite-apps=['zen.desktop', 'kitty.desktop', 'nvim.desktop']
{{ end -}}

welcome-dialog-last-shown-version='67.0'

[org/gnome/shell/extensions/app-hider]
# Dconf doesn't support escaping newlines.
{{ $hiddenApps := list
      "avahi-discover.desktop"
      "assistant.desktop"
      "bssh.desktop"
      "btop.desktop"
      "bvnc.desktop"
      "designer.desktop"
      "jconsole-java-openjdk.desktop"
      "jshell-java-openjdk.desktop"
      "linguist.desktop"
      "lstopo.desktop"
      "nvim.desktop"
      "nvtop.desktop"
      "org.gnome.Extensions.desktop"
      "org.gnome.Settings.desktop"
      "qdbusviewer.desktop"
      "qv4l2.desktop"
      "qvidcap.desktop"
      "scrcpy-console.desktop"
      "scrcpy.desktop"
      "stoken-gui.desktop"
      "stoken-gui-small.desktop"
      "yazi.desktop" -}}
hidden-apps=[{{ quoteList $hiddenApps | join ", " }}]

[org/gnome/shell/extensions/copyous]
clipboard-history='keep-all'
database-backend='sqlite'
history-length=500
indicator-display='hidden'
open-clipboard-dialog-shortcut=['<Super>v']
sound='message'

[org/gnome/shell/extensions/forcequit]
hide-button=true

[org/gnome/shell/extensions/tiling-assistant]
enable-tiling-popup=false

[org/gnome/shell/keybindings]
screenshot=['Print']
screenshot-window=['<Super>Print']
show-screenshot-ui=['<Shift><Super>s']
toggle-message-tray=['']

[system/locale]
{{ if .isPersonal -}}
region='bg_BG.UTF-8'
{{ end -}}
