packages:
  base:
    bash:
      scoop: null
    bat:
    btop:
    chezmoi:
    chsh:
      apk: "shadow"
      apt: "passwd"
      pacman: "util-linux"
    coreutils:
      scoop: "uutils-coreutils"
    cowsay:
    curl:
    eza:
    fastfetch:
    fd:
      apt: "fd-find"
    fish:
    fzf:
    grep:
    git:
    git-delta:
      apk: "delta"
      scoop: "delta"
    kitty-terminfo:
    less:
    libatomic:
      apt: "libatomic1" # Needed by `mise`, `node` specifically.
      "*": null
    neovim:
    ripgrep:
    sfsu:
      scoop: "sfsu"
      "*": null
    starship:
    sudo:
      scoop: "gsudo"
    tar:
      scoop: null
    tealdeer:
    wget:
    xdg-utils:
    yazi:
      pacman: "yazi ttf-nerd-fonts-symbols" # Needs `ttf-font-nerd` provider.
    zoxide:

  gui:
    altsnap:
      scoop: "altsnap"
      "*": null
    ditto:
      scoop: "ditto"
      "*": null
    kitty:
      scoop: "windows-terminal"
    process-explorer:
      scoop: "process-explorer"
      "*": null
    zed:
      pacman: "zed vulkan-swrast" # Needs `vulkan-driver` provider.
    zen-browser-bin:
      scoop: "zen-browser"

  guiGnome:
    gnome:
      pacman: "gdm gnome-shell gnome-control-center"
      apt: "gdm3 gnome-shell gnome-control-center"
      apk: "gdm gnome-shell gnome-control-center"

  kvmGuest:
    spice-vdagent:
      scoop: "virtio-guest-tools"

  oracleGuest:
    virtualbox-guest-utils:
      apk: "virtualbox-guest-additions virtualbox-guest-additions-x11"
