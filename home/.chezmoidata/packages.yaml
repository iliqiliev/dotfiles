packages:
  bash:
    __tags__: ["linux"]
  bat:
  btop:
  chezmoi:
  chsh:
    __tags__: ["linux"]
    apk: "shadow"
    apt: "passwd"
    pacman: "util-linux"
  coreutils:
    scoop: "uutils-coreutils"
  cowsay:
  curl:
  eza:
  fastfetch:
  fd:
    apt: "fd-find"
  fish:
    __tags__: ["linux"]
  fzf:
  grep:
  git:
  git-delta:
    apk: "delta"
    scoop: "delta"
  kitty-terminfo:
    __tags__: ["linux"]
  less:
  neovim:
  ripgrep:
  scoop:
    __tags__: ["windows"]
    scoop: "sfsu vcredist-aio"
  starship:
  sudo:
    scoop: "gsudo"
  tar:
    __tags__: ["linux"]
  tealdeer:
  wget:
  yazi:
    pacman: "yazi ttf-nerd-fonts-symbols" # Needs `ttf-font-nerd` provider.
  zoxide:

  spice-vdagent:
    __tags__: ["kvm-guest"]
    scoop: "virtio-guest-tools"
  virtualbox-guest-utils:
    __tags__: ["linux", "oracle-guest"]
    apk: virtualbox-guest-additions
    dnf: virtualbox-guest-additions
  virtualbox-guest-utils-gui:
    __tags__: ["gui", "linux", "oracle-guest"]
    apk: "virtualbox-guest-additions-x11"
    "*": null

  altsnap:
    __tags__: ["gui", "windows"]
  ditto:
    __tags__: ["gui", "windows"]
  gnome:
    __tags__: ["gnome", "gui", "linux"]
    apk: "gdm gnome-shell gnome-control-center"
    apt: "gdm3 gnome-shell gnome-control-center"
    dnf: "gdm gnome-shell gnome-control-center"
    pacman: "gdm gnome-shell gnome-control-center"
  kitty:
    __tags__: ["gui"]
    scoop: "konsole-nightly"
  kodi:
    __tags__: ["gui", "linux"]
  process-explorer:
    __tags__: ["gui", "windows"]
  qalculate-gtk:
    __tags__: ["gui"]
    scoop: "qalculate"
  zed:
    __tags__: ["gui"]
    pacman: "zed vulkan-swrast" # Needs `vulkan-driver` provider.
  zen-browser-bin:
    __tags__: ["gui", "no-work"]
    scoop: "zen-browser"
