# The supported package managers are:
#   apk, apt, dnf, pacman, scoop.
#
# The supported tags, used to filter packages, are:
#   alpine, arch, gui, gnome, kvm-guest, linux, no-work, oracle-guest, windows.
#
# Use the following command to evaluate the packages:
#   `chezmoi execute-template '{{ template "packages" . }}'`

packages:
  bash:
    __tags__: ["linux"]
  bat:
  btop:
  chezmoi:
  chsh:
    __tags__: ["linux"]
    apk: "shadow"
    apt: "passwd"
    pacman: "util-linux"
  coreutils:
    scoop: "uutils-coreutils"
  cowsay:
  curl:
  dua:
    apt: "dua-cli"
    dnf: "rust-dua-cli"
    pacman: "dua-cli"
  eza:
  fastfetch:
  fd:
    apt: "fd-find"
  file:
    # Scoop's file cannot handle Unicode filenames. Git's file is used instead.
    __tags__: ["linux"]
  fish:
    __tags__: ["linux"]
  fzf:
  grep:
  git:
  git-delta:
    apk: "delta"
    scoop: "delta"
  kitty-terminfo:
    __tags__: ["linux"]
  less:
  neovim:
  ripgrep:
  scoop:
    __tags__: ["windows"]
    scoop: "sfsu vcredist-aio"
  sched-ext:
    __tags__: ["arch"]
    pacman: "scx-tools"
  sudo:
    scoop: "gsudo"
  tar:
    __tags__: ["linux"]
  tealdeer:
  yazi:
    pacman: "yazi ttf-nerd-fonts-symbols" # Needs `ttf-font-nerd` provider.

  altsnap:
    __tags__: ["gui", "windows"]
  ditto:
    __tags__: ["gui", "windows"]
  kitty:
    __tags__: ["gui"]
    scoop: "konsole-nightly"
  kodi:
    __tags__: ["gui", "linux"]
  process-explorer:
    __tags__: ["gui", "windows"]
  qalculate-gtk:
    __tags__: ["gui"]
    scoop: "qalculate"
  zed:
    __tags__: ["gui"]
    pacman: "zed vulkan-swrast" # Needs `vulkan-driver` provider.
  zen-browser-bin:
    __tags__: ["gui", "no-work"]
    scoop: "zen-browser"

  gnome:
    __tags__: ["gnome"]
    apk: "gdm gnome-shell gnome-control-center"
    apt: "gdm3 gnome-shell gnome-control-center"
    dnf: "gdm gnome-shell gnome-control-center"
    pacman: "gdm gnome-shell gnome-control-center"
  gnome-keyring:
    __tags__: ["gnome"]
  libgda:
    __tags__: ["gnome"]
    apt: "gir1.2-gda-5.0"
    dnf: "libgda-sqlite"
    pacman: "libgda6"
  mission-center:
    __tags__: ["gnome"]
    pacman: "mission-center nethogs"

  spice-vdagent:
    __tags__: ["kvm-guest"]
    scoop: "virtio-guest-tools"
  virtualbox-guest-utils:
    __tags__: ["linux", "oracle-guest"]
    apk: virtualbox-guest-additions
    dnf: virtualbox-guest-additions
  virtualbox-guest-utils-gui:
    __tags__: ["alpine", "gui", "oracle-guest"]
    apk: "virtualbox-guest-additions-x11"
