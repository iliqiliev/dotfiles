packages:
  bash:
    scoop: null
  bat:
  btop:
  chezmoi:
  chsh:
    apk: "shadow"
    apt: "passwd"
    dnf: "util-linux"
    pacman: "util-linux"
    scoop: null
  coreutils:
    scoop: "uutils-coreutils"
  cowsay:
  curl:
  eza:
  fastfetch:
  fd:
    apt: "fd-find"
    dnf: "fd-find"
  fish:
    scoop: null
  fzf:
  grep:
  git:
  git-delta:
    apk: "delta"
    scoop: "delta"
  kitty-terminfo:
    scoop: null
  less:
  neovim:
  ripgrep:
  scoop:
    scoop: "sfsu vcredist-aio"
    "*": null
  starship:
  sudo:
    scoop: "gsudo"
  tar:
    scoop: null
  tealdeer:
  wget:
  yazi:
    pacman: "yazi ttf-nerd-fonts-symbols" # Needs `ttf-font-nerd` provider.
  zoxide:

  spice-vdagent:
